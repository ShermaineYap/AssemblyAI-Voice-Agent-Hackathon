services:
  - type: web
    name: vivavoice
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PHONE_TOOL_SECRET   # optional: enables phone-in (npm run phone prints one)
        sync: false
      - key: PHONE_NUMBER        # optional: the number shown on the phone-in screen
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: TOKENS_PER_HOUR
        value: "20"
      - key: MAX_SESSION_SECONDS
        value: "1800"
